const DATA=JSON.parse(document.getElementById('seed').textContent);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const companies=DATA['04_COMPANIES'],scores=DATA['05_SCORECARD'],watch=DATA['06_WATCHLIST'],gurus=DATA['02_GURUS'],holdings=DATA['03_HOLDINGS'],signals=DATA['07_RADAR_LOG'],queue=DATA['11_RESEARCH_QUEUE'];const scoreMap=Object.fromEntries(scores.map(s=>[s.Ticker,s]));const watchMap=Object.fromEntries(watch.map(s=>[s.Ticker,s]));const holdingsMap={};holdings.forEach(h=>(holdingsMap[h.Ticker]??=[]).push(h));let state={tab:'dashboard',query:'',tier:'Todos',status:'Todos',detail:null};let local={};try{local=JSON.parse(localStorage.getItem('ciip_local_v1')||'{}')}catch{}const save=()=>localStorage.setItem('ciip_local_v1',JSON.stringify(local));let market={};try{market=JSON.parse(localStorage.getItem('ciip_market_v1')||'{}')}catch{}const saveMarket=()=>localStorage.setItem('ciip_market_v1',JSON.stringify(market));
function marketTemplate(){const head='Ticker;Precio;Moneda;Fecha;Fuente;URL';const rows=companies.map(c=>[c.Ticker,'','','','',''].join(';'));download(new Blob(['\ufeff'+[head,...rows].join('\n')],{type:'text/csv;charset=utf-8'}),'ciip_plantilla_mercado.csv')}
async function importMarket(file){if(!file)return;try{const raw=(await file.text()).replace(/^\ufeff/,'').trim();const lines=raw.split(/\r?\n/).filter(Boolean);const sep=lines[0].includes(';')?';':',';const fields=lines.shift().split(sep).map(x=>x.trim().toLowerCase());const required=['ticker','precio','moneda','fecha','fuente','url'];if(required.some(x=>!fields.includes(x)))throw Error('Cabeceras obligatorias: '+required.join(', '));let count=0;let next={...market};let errors=[];for(let i=0;i<lines.length;i++){const cells=lines[i].split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const o=Object.fromEntries(fields.map((x,j)=>[x,cells[j]||'']));if(!o.precio)continue;const price=Number(o.precio.replace(',','.'));const date=new Date(o.fecha+'T00:00:00Z');const url=o.url;const ticker=o.ticker.toUpperCase();if(!companies.some(c=>c.Ticker===ticker)||!Number.isFinite(price)||price<=0||!['EUR','USD','GBP','CAD','CHF','JPY','DKK','NOK','SEK','PLN','HKD','TWD'].includes(o.moneda.toUpperCase())||!/^\d{4}-\d{2}-\d{2}$/.test(o.fecha)||!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==o.fecha||date.getTime()>Date.now()+86400000||!o.fuente||!/^https:\/\//i.test(url)){errors.push(i+2);continue}next[ticker]={price,currency:o.moneda.toUpperCase(),date:o.fecha,source:o.fuente,url};count++}if(errors.length)throw Error('Filas no válidas: '+errors.slice(0,12).join(', ')+(errors.length>12?'…':''));if(!count)throw Error('No hay filas con precios válidos');market=next;saveMarket();alert(count+' cotizaciones de referencia importadas. Datos aportados por el usuario, no verificados automáticamente.');render()}catch(e){alert('Importación cancelada: '+e.message)}finally{file.value=''}}
function clearMarket(){if(confirm('¿Borrar todas las cotizaciones importadas en este navegador?')){market={};saveMarket();render()}}
let fundamentals=null,fundamentalsError='';
async function refreshFundamentals(){try{const r=await fetch('./fundamentals-auto.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schema!=='ciip-fundamentals-v1')throw Error('Formato desconocido');fundamentals=d;fundamentalsError=''}catch(e){fundamentals=null;fundamentalsError=e.message}if(['fundamentals','financial','valuation','history','radar'].includes(state.tab))render()}

function financeMillions(v){return Number(v/1000000).toLocaleString('es-ES',{maximumFractionDigits:1})}
function financePct(v){return v==null||!Number.isFinite(v)?'—':(100*v).toLocaleString('es-ES',{maximumFractionDigits:1})+' %'}
function financialRecord(company){
 const f=fundamentals?.companies?.[company.Ticker];if(!f)return null;
 const m=f.metrics||{},rev=m.revenue?.period==='FY'&&m.revenue.value>0?m.revenue:null;
 const sameYear=(x,y)=>!!x&&!!y&&x.period==='FY'&&y.period==='FY'&&x.start===y.start&&x.end===y.end;
 const op=rev&&sameYear(m.operating_income,rev)?m.operating_income.value/rev.value:null;
 const net=rev&&sameYear(m.net_income,rev)?m.net_income.value/rev.value:null;
 const ocf=m.operating_cash_flow,cap=m.capex;
 const fcf=ocf&&cap&&sameYear(ocf,cap)&&Number.isFinite(Number(ocf.value))&&Number.isFinite(Number(cap.value))&&Number(cap.value)>=0?Number(ocf.value)-Number(cap.value):null;
 const anomaly=(op!==null&&Math.abs(op)>1)||(net!==null&&Math.abs(net)>1);
 const incomplete=!rev||op===null||net===null||fcf===null;
 return {company,filing:f,metrics:m,revenue:rev,op,net,fcf,anomaly,incomplete,period:f.annual_reference_end||'—'};
}
function financialView(){
 const data=companies.map(financialRecord).filter(Boolean);
 const opCount=data.filter(x=>x.op!==null).length;
 const netCount=data.filter(x=>x.net!==null).length;
 const fcfCount=data.filter(x=>x.fcf!==null).length;
 const tr=data.map(x=>{
   const c=x.company,f=x.filing,complete=!x.incomplete&&!x.anomaly;
   const status=x.anomaly?'Revisar anomalía':complete?'Calculable':'Parcial';
   return '<tr data-search="'+esc((c.Ticker+' '+c.Empresa).toLowerCase())+'"><td><b>'+esc(c.Ticker)+'</b><div class="muted tiny">'+esc(c.Empresa)+'</div></td><td>'+esc(x.period)+'</td><td>'+(x.revenue?financeMillions(x.revenue.value):'—')+'</td><td>'+financePct(x.op)+'</td><td>'+financePct(x.net)+'</td><td>'+(x.fcf!==null?financeMillions(x.fcf):'—')+'</td><td><span class="tiny">'+esc(status)+'</span></td><td><button class="btn secondary" onclick="openFinancialDetail(\''+esc(c.Ticker)+'\')">Ficha</button></td></tr>';
 });
 return '<div class="stats">'+stat('Cobertura SEC',data.length+' empresas','De '+companies.length+' iniciales')+stat('Margen operativo',opCount+' empresas','Ejercicio comparable')+stat('Margen neto',netCount+' empresas','Ejercicio comparable')+stat('FCF aproximado',fcfCount+' empresas','Flujo operativo − CAPEX')+'</div>'+
 '<section class="panel"><h2>Diagnóstico financiero · datos declarados</h2><p class="muted">Importes en millones de USD. Los márgenes se calculan únicamente con ingresos y beneficios del mismo ejercicio fiscal y fechas inicial y final coincidentes. FCF aproximado = flujo de caja operativo menos pagos por inmovilizado, del mismo ejercicio. No incluye adquisiciones ni todos los compromisos de capital. Los importes son provisionales y no están auditados por CIIP.</p><p class="muted tiny">Un dato ausente no equivale a cero. El balance más reciente puede ser posterior al ejercicio de pérdidas y ganancias. No se muestran ROIC, EV/FCF, PER ni estimaciones de valor intrínseco sin datos adicionales.</p><input class="input" style="margin-bottom:14px;width:100%" placeholder="Filtrar por empresa o ticker" aria-label="Filtrar empresas" oninput="filterFinancial(this.value)"><div id="finTable">'+table(['Empresa','Cierre fiscal','Ingresos M USD','Margen op.','Margen neto','FCF aprox. M USD','Cobertura','Detalle'],tr)+'</div></section>'+
 '<section class="panel"><h2>Reglas de validación</h2><p class="muted">Los ratios solo se muestran cuando los periodos son compatibles. Las fichas permiten consultar cada campo, etiqueta US GAAP, ejercicio, presentación y enlace al documento fuente SEC. Los ratios superiores al 100 % en valor absoluto se marcan para revisión. No hay recomendaciones automáticas de compra ni valoración por múltiplos.</p></section>';
}
function filterFinancial(value){const q=String(value||'').trim().toLowerCase();document.querySelectorAll('#finTable tbody tr').forEach(tr=>{tr.style.display=(tr.dataset.search||'').includes(q)?'':'none'})}
function openFinancialDetail(ticker){
 const c=companies.find(x=>x.Ticker===ticker);if(!c)return;
 const r=financialRecord(c);if(!r)return;
 document.getElementById('overlay')?.remove();document.getElementById('detail')?.remove();
 const overlay=document.createElement('div');overlay.className='overlay';overlay.id='overlay';overlay.onclick=closeDetail;document.body.append(overlay);
 const detail=document.createElement('aside');detail.className='detail';detail.id='detail';
 const all=Object.entries(r.metrics);
 const filingLink=m=>m&&/^\d{10}$/.test(r.filing.cik)&&/^\d{10}-\d{2}-\d{6}$/.test(m.accession)?'https://www.sec.gov/Archives/edgar/data/'+Number(r.filing.cik)+'/'+m.accession.replaceAll('-','')+'/':r.filing.url;
 const names={revenue:'Ingresos',net_income:'Beneficio neto',operating_income:'Beneficio operativo',operating_cash_flow:'Flujo de caja operativo',capex:'Inversión en inmovilizado (CAPEX)',assets:'Activos',liabilities:'Pasivos',cash:'Efectivo',long_term_debt:'Deuda financiera a largo plazo'};
 const cards=all.map(([key,m])=>'<div style="padding:10px 0;border-bottom:1px solid #304057"><b>'+esc(names[key]||key)+'</b><div>'+(m?financeMillions(m.value)+' M USD':'Sin dato comparable')+'</div>'+(m?'<div class="muted tiny">'+esc(m.period)+' · '+esc(m.start||'Saldo')+' a '+esc(m.end)+' · '+esc(m.form)+' presentado '+esc(m.filed)+'</div><div class="muted tiny">US GAAP: '+esc(m.tag)+' · Accession '+esc(m.accession)+'</div><a class="link tiny" href="'+esc(filingLink(m))+'" target="_blank" rel="noopener noreferrer">Ver declaración original ↗</a>':'')+'</div>').join('');
 detail.innerHTML='<div class="actions" style="justify-content:space-between"><b>Detalle financiero SEC</b>'+button('Cerrar ✕','closeDetail()')+'</div><h2>'+esc(c.Empresa)+'</h2><p class="muted">'+esc(ticker)+' · Ejercicio de referencia '+esc(r.period)+'</p><div class="stats" style="grid-template-columns:1fr 1fr">'+stat('Margen operativo',financePct(r.op),'Mismo FY')+stat('FCF aproximado',r.fcf===null?'—':financeMillions(r.fcf)+' M USD','No es flujo libre ajustado')+'</div><div class="section"><h3>Datos publicados y periodos</h3>'+cards+'</div><div class="section"><a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(r.filing.url)+'">Abrir compañía en SEC Company Facts ↗</a><p class="muted tiny">Las cifras XBRL requieren revisión antes de una decisión de inversión. La deuda mostrada no incluye necesariamente todos los pasivos financieros ni arrendamientos.</p></div>';

function fundamentalView(){const rows=companies.filter(c=>fundamentals?.companies?.[c.Ticker]).map(c=>{const f=fundamentals.companies[c.Ticker];const revenue=f.metrics.revenue,net=f.metrics.net_income,ocf=f.metrics.operating_cash_flow;const cell=m=>m?'<b>'+Number(m.value).toLocaleString('es-ES',{maximumFractionDigits:0})+'</b><div class="muted tiny">'+esc(m.period)+' · '+esc(m.end)+'</div>':'—';return '<tr><td><b>'+esc(c.Ticker)+'</b><div class="muted tiny">'+esc(c.Empresa)+'</div></td><td>'+cell(revenue)+'</td><td>'+cell(net)+'</td><td>'+cell(ocf)+'</td><td><a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(f.url)+'">SEC EDGAR ↗</a></td></tr>'});return '<section class="panel"><h2>Fundamentales declarados · SEC EDGAR</h2><p class="muted">Datos originales XBRL US GAAP, en USD. Las cifras pueden corresponder a periodos distintos: se indica FY, trimestre (Q) y fecha de cierre. No se suman ni comparan directamente periodos incompatibles. La extracción no equivale a una validación contable ni permite calcular automáticamente FCF, ROIC o valor intrínseco.</p><p><b>'+rows.length+' empresas</b> con datos · Archivo: '+esc(fundamentals?.generated_at?new Date(fundamentals.generated_at).toLocaleString('es-ES'):'Pendiente de primera ejecución')+'</p><div class="actions">'+button('Actualizar lectura','refreshFundamentals()','')+'</div>'+(fundamentalsError?'<p class="muted">Sin archivo actualizado: '+esc(fundamentalsError)+'</p>':'')+table(['Empresa','Ingresos (USD)','Beneficio neto (USD)','Flujo operativo (USD)','Fuente'],rows)+'</section>'}

function marketView(){const items=companies.filter(c=>market[c.Ticker]);const auto=autoMarket?.prices||{};const autoItems=companies.filter(c=>auto[c.Ticker]);const generation=autoMarket?.generated_at?new Date(autoMarket.generated_at).toLocaleString('es-ES'):'Sin actualización';const autoRows=autoItems.map(c=>{const p=auto[c.Ticker],days=Math.floor((Date.now()-new Date(p.date+'T00:00:00Z').getTime())/86400000);return '<tr><td><b>'+esc(c.Ticker)+'</b><div class="muted tiny">'+esc(c.Empresa)+'</div></td><td>'+Number(p.price).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+esc(p.currency)+'</td><td>'+esc(p.date)+'</td><td><a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(p.url)+'">'+esc(p.source)+' ↗</a></td><td>'+badge(days>5?'ANTIGUO':days>2?'REVISAR':'CIERRE')+'</td></tr>'});return '<section class="panel"><h2>Cotizaciones automáticas · cierre diario</h2><p class="muted">Fuentes: Yahoo Finance (principal) y Stooq (respaldo), precios de cierre diarios. Actualización programada de lunes a viernes mediante GitHub Actions. No son precios en tiempo real; pueden estar retrasados, incompletos o sin ajustar. La correspondencia de símbolos debe contrastarse con el mercado primario. No se calculan recomendaciones de compra.</p><p><b>'+autoItems.length+' compañías</b> con observaciones · Generado: '+esc(generation)+'</p><div class="actions">'+button('Actualizar lectura','refreshAutoMarket()','')+'</div>'+(autoError?'<p class="muted">Archivo automático no disponible: '+esc(autoError)+'. Se generará al ejecutar el flujo de datos por primera vez.</p>':'')+table(['Compañía','Cierre','Fecha','Proveedor','Vigencia'],autoRows)+'</section><section class="panel"><h2>Precios manuales · carga documentada</h2><p class="muted">Importación opcional para valores sin cobertura automática. Los datos manuales permanecen en este navegador y no sustituyen los registros automáticos.</p><div class="actions">'+button('Descargar plantilla CSV','marketTemplate()','')+button('Importar precios CSV','document.getElementById("marketFile").click()')+button('Borrar precios','clearMarket()','danger')+'</div><input id="marketFile" type="file" accept=".csv,text/csv" class="hidden" onchange="importMarket(this.files[0])"><p class="muted tiny">Formato: Ticker;Precio;Moneda;Fecha (AAAA-MM-DD);Fuente;URL.</p></section><section class="panel"><h2>Cotizaciones manuales ('+items.length+')</h2>'+table(['Compañía','Precio','Fecha','Fuente','Antigüedad'],items.map(c=>{const p=market[c.Ticker];const days=Math.floor((Date.now()-new Date(p.date+'T00:00:00Z').getTime())/86400000);return '<tr><td><b>'+esc(c.Ticker)+'</b></td><td>'+Number(p.price).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+esc(p.currency)+'</td><td>'+esc(p.date)+'</td><td><a class="link" target="_blank" rel="noopener noreferrer" href="'+esc(p.url)+'">'+esc(p.source)+' ↗</a></td><td>'+badge(days>7?'ANTIGUO':days>1?'REVISAR':'RECIENTE')+'</td></tr>'}))+'</section>'}

function layout(){const nav=[['dashboard','◫','Dashboard'],['radar','⌁','Radar'],['watchlist','◉','Watchlist'],['research','◇','Investigación'],['gurus','♜','Gestores'],['market','▤','Mercado'],['fundamentals','▥','Fundamentales'],['financial','◈','Análisis'],['history','▦','Históricos'],['valuation','◇','Valoración'],['settings','⚙','Datos']];$('#app').innerHTML=`<div class="app"><aside class="side"><div class="logo">CIIP</div><div class="sub">INVESTMENT INTELLIGENCE</div>${nav.map(([id,icon,label])=>`<button class="nav ${state.tab===id?'active':''}" onclick="go('${id}')"><span>${icon}</span><span class="label">${label}</span></button>`).join('')}</aside><main class="main"><header class="top"><div><div class="eyebrow">Carlos Investment Intelligence Platform</div><h1>${{dashboard:'Panel ejecutivo',radar:'Investment Radar',watchlist:'Watchlist maestra',research:'Centro de investigación',gurus:'Gestores y fuentes',market:'Datos de mercado',fundamentals:'Datos fundamentales',financial:'Análisis financiero',history:'Históricos SEC',valuation:'Valoración DCF',settings:'Datos y configuración'}[state.tab]}</h1></div><span class="pill">CIIP · v1.1 PWA</span></header><div class="notice">Datos iniciales procedentes del CIIP v2.0 (corte de julio de 2026). No son cotizaciones ni señales en tiempo real. Las puntuaciones son provisionales y no equivalen a recomendaciones de compra.</div><div id="view"></div><footer class="footer">CIIP · Investigación privada · Los cambios locales se guardan en este dispositivo. Sin sincronización entre usuarios ni ejecución de órdenes.</footer></main></div>`;render()}

if(state.tab==='watchlist'){let rows=companies.filter(c=>(state.tier==='Todos'||c.Tier===state.tier)&&(state.status==='Todos'||(local[c.Ticker]?.status||c.Estado)===state.status)&&[c.Ticker,c.Empresa,c.Sector,c['Tesis_breve']].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>(scoreMap[b.Ticker]?.Investment_Score||0)-(scoreMap[a.Ticker]?.Investment_Score||0));v=`<section class="panel"><div class="filters"><input id="search" class="input" placeholder="Buscar compañía, ticker o sector" value="${esc(state.query)}" oninput="state.query=this.value;updateWatch()"><select class="select" onchange="state.tier=this.value;updateWatch()"><option>Todos</option>${['Tier 1','Tier 2','Value','Exploratory'].map(t=>`<option ${state.tier===t?'selected':''}>${t}</option>`).join('')}</select><select class="select" onchange="state.status=this.value;updateWatch()"><option>Todos</option>${['SCREENED','RESEARCH','WATCH','READY','REVIEW','REJECT'].map(t=>`<option ${state.status===t?'selected':''}>${t}</option>`).join('')}</select></div><div id="watchrows"></div></section>`;$('#view').innerHTML=v;window.updateWatch=()=>{let rows=companies.filter(c=>(state.tier==='Todos'||c.Tier===state.tier)&&(state.status==='Todos'||(local[c.Ticker]?.status||c.Estado)===state.status)&&[c.Ticker,c.Empresa,c.Sector,c.Tesis_breve].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>(scoreMap[b.Ticker]?.Investment_Score||0)-(scoreMap[a.Ticker]?.Investment_Score||0));$('#watchrows').innerHTML=`<p class="muted tiny">${rows.length} compañías · Selecciona una para abrir su ficha.</p>`+table(['Ticker / empresa','Sector','Tier','Score','Estado'],rows.map(c=>`<tr style="cursor:pointer" onclick="openDetail('${esc(c.Ticker)}')"><td><span class="ticker">${esc(c.Ticker)}</span><div class="muted tiny">${esc(c.Empresa)}</div></td><td>${esc(c.Sector)}</td><td>${esc(c.Tier)}</td><td class="score">${num(scoreMap[c.Ticker]?.Investment_Score)}</td><td>${badge(local[c.Ticker]?.status||c.Estado)}</td></tr>`))};updateWatch();return}
if(state.tab==='radar'){v=ciipRadarResearchPanel()+`<section class="panel"><h2>Registro de señales · ${signals.length} entradas</h2>${table(['Fecha','Fuente','Señal','Evidencia'],signals.map(s=>`<tr><td>${esc(s.Fecha)}</td><td><b>${esc(s.Fuente)}</b><div class="muted tiny">${esc(s['Ticker/objeto'])}</div></td><td>${esc(s['Señal'])}<div class="muted tiny">${esc(s['Impacto / lectura'])}</div></td><td>${badge(s.Verificación)}<div class="tiny muted">${esc(s.Tipo_evidencia)}</div>${String(s.URL).startsWith('http')?`<a class="link tiny" target="_blank" rel="noopener" href="${esc(s.URL)}">Fuente ↗</a>`:''}</td></tr>`))}</section>`}
if(state.tab==='research'){v=`<section class="panel"><h2>Cola de investigación · ${queue.length} prioridades</h2>${table(['#','Compañía','Por qué ahora','Pregunta principal','Seguimiento'],queue.map(r=>`<tr><td>${esc(r.Rank)}</td><td><a href="#" class="link ticker" onclick="openDetail('${esc(r.Ticker)}');return false">${esc(r.Ticker)}</a><div class="tiny muted">${esc(r.Empresa)}</div></td><td>${esc(r['Why now'])}</td><td>${esc(r['Question 1'])}<div class="muted tiny">${esc(r['Question 2'])}</div></td><td><select class="select" onchange="setTask('${esc(r.Ticker)}',this.value)">${['OPEN','IN PROGRESS','DONE','BLOCKED'].map(s=>`<option ${(local['task_'+r.Ticker]?.status||r.Status)===s?'selected':''}>${s}</option>`).join('')}</select><div class="muted tiny">${esc(r['Due date'])}</div></td></tr>`))}</section>`}

function setTask(ticker,status){local['task_'+ticker]={...(local['task_'+ticker]||{}),status};save()}function openDetail(ticker){const c=companies.find(c=>c.Ticker===ticker);if(!c)return;const s=scoreMap[ticker]||{},w=watchMap[ticker]||{},n=local[ticker]||{};const matches=holdings.filter(h=>h.Ticker===ticker);let overlay=document.createElement('div');overlay.className='overlay';overlay.id='overlay';overlay.onclick=closeDetail;document.body.append(overlay);let d=document.createElement('aside');d.className='detail';d.id='detail';d.innerHTML=`<div class="actions" style="justify-content:space-between">${badge(c.Tier)}${button('Cerrar ✕','closeDetail()')}</div><h2>${esc(c.Empresa)}</h2><p class="muted">${esc(ticker)} · ${esc(c.Sector)} · ${esc(c.País)}</p><div class="stats" style="grid-template-columns:1fr 1fr">${stat('Investment Score',num(s.Investment_Score),'Provisional')}${stat('Prioridad',esc(c.Prioridad),'Según base CIIP')}</div><div class="section"><h3>Tesis inicial</h3><p>${esc(c.Tesis_breve)}</p><h3>Riesgo principal</h3><p>${esc(c.Riesgo_principal)}</p></div><div class="section"><h3>Desglose del score (0–10)</h3>${[['Calidad',s.Calidad_0_10],['Management',s.Management_0_10],['Moat',s.Moat_0_10],['Crecimiento',s.Crecimiento_0_10],['Valoración',s.Valoración_0_10],['Control de riesgos',s.Riesgo_control_0_10]].map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin:8px 0"><span>${k}</span><b>${num(v)}</b></div><div style="height:5px;background:#2b4058;border-radius:4px"><div style="width:${Math.min(100,Number(v)*10)}%;height:100%;background:#5ac9c1;border-radius:4px"></div></div>`).join('')}</div><div class="section"><h3>Apariciones registradas (${matches.length})</h3>${matches.length?matches.map(h=>`<p class="tiny"><b>${esc(h.Guru_ID)}</b> · ${esc(h['Tipo_aparición'])} · ${esc(h.Fecha_corte)} ${h['Peso_%']!==''?'· '+esc(h['Peso_%'])+'%':''}</p>`).join(''):'<p class="muted tiny">No hay apariciones registradas en la muestra inicial.</p>'}</div><div class="section"><h3>Mi seguimiento</h3><label class="muted tiny">Estado</label><select class="select" style="display:block;width:100%;margin:8px 0 14px" id="detailStatus">${['SCREENED','RESEARCH','WATCH','READY','REVIEW','REJECT'].map(v=>`<option ${(n.status||c.Estado)===v?'selected':''}>${v}</option>`).join('')}</select><label class="muted tiny">Notas privadas</label><textarea class="textarea" id="detailNotes" placeholder="Tesis, dudas, valoración, catalizadores...">${esc(n.notes||'')}</textarea><div class="actions" style="margin-top:12px">${button('Guardar cambios',`saveDetail('${esc(ticker)}')`,'')}</div></div><div class="section"><h3>Fuente corporativa</h3>${String(c.IR_URL).startsWith('http')?`<a class="link" href="${esc(c.IR_URL)}" target="_blank" rel="noopener">Investor Relations ↗</a>`:'No disponible'}</div>`;document.body.append(d)}function closeDetail(){document.getElementById('overlay')?.remove();document.getElementById('detail')?.remove()}function saveDetail(ticker){local[ticker]={status:$('#detailStatus').value,notes:$('#detailNotes').value,updatedAt:new Date().toISOString()};save();closeDetail();render()}function exportNotes(){const blob=new Blob([JSON.stringify({format:'CIIP_LOCAL_V1',exportedAt:new Date().toISOString(),data:local},null,2)],{type:'application/json'});download(blob,'ciip_notas.json')}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importNotes(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.format!=='CIIP_LOCAL_V1'||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data))throw Error('Formato incorrecto');local={...local,...obj.data};save();alert('Notas importadas');render()}catch(e){alert('No se pudo importar: '+e.message)}}function clearNotes(){if(confirm('¿Borrar las notas y estados guardados en este dispositivo?')){local={};save();render()}}function exportCSV(){const fields=['Ticker','Empresa','Sector','Tier','Estado','Score'];const lines=[fields.join(';'),...companies.map(c=>[c.Ticker,c.Empresa,c.Sector,c.Tier,local[c.Ticker]?.status||c.Estado,scoreMap[c.Ticker]?.Investment_Score||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';'))];download(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),'ciip_universo.csv')}function ciipInit(){
