name: CIIP Daily Market Data
on:
  schedule:
    - cron: '25 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ciip-market-data
  cancel-in-progress: false
jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve closing prices
        run: python scripts/update_market.py
      - name: Commit observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-auto.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh CIIP closing prices"
            git push
          fi
