name: QVR Valoración Fundamental Semanal
on:
  workflow_dispatch:
  push:
    paths:
      - 'quality-value-radar/scripts/economic_review_v4.py'
      - 'quality-value-radar/scripts/reliability_v5.py'
      - 'quality-value-radar/scripts/opportunity_v6.py'
      - 'quality-value-radar/scripts/sensitivity_v7.py'
      - 'quality-value-radar/scripts/audit_v8.py'
      - 'quality-value-radar/scripts/economic_v9.py'
      - 'quality-value-radar/scripts/opportunity_alerts_v6.py'
      - 'quality-value-radar/scripts/test_opportunity_v6.py'
      - 'quality-value-radar/scripts/opportunity_v6.py'
  schedule:
    - cron: '15 9 * * 3'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: qvr-fundamental-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar código
        run: |
          python -m py_compile quality-value-radar/scripts/build_intrinsic_radar.py
          node --check quality-value-radar/app.js
          python -m json.tool quality-value-radar/data/international.json > /dev/null
          python -m py_compile quality-value-radar/scripts/enrich_sec_metrics.py
          python -m py_compile quality-value-radar/scripts/value_international.py
          python -m py_compile quality-value-radar/scripts/economic_review_v4.py
          python -m py_compile quality-value-radar/scripts/reliability_v5.py
          python -m py_compile quality-value-radar/scripts/opportunity_v6.py
          python -m py_compile quality-value-radar/scripts/sensitivity_v7.py
          python -m py_compile quality-value-radar/scripts/audit_v8.py
          python -m py_compile quality-value-radar/scripts/economic_v9.py
          python -m py_compile quality-value-radar/scripts/opportunity_alerts_v6.py
          python -m unittest discover -s quality-value-radar/scripts -p 'test_opportunity_v6.py' -v
      - name: Generar análisis SEC y precios históricos
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python quality-value-radar/scripts/build_intrinsic_radar.py
      - name: Incorporar TTM y ROIC ajustado
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python quality-value-radar/scripts/enrich_sec_metrics.py
      - name: Verificar flujo de caja, adquisiciones y múltiplos
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python quality-value-radar/scripts/economic_review_v4.py
      - name: Valorar compañías internacionales con fuente y cambio verificados
        run: python quality-value-radar/scripts/value_international.py
      - name: Comprobar retornos M&A, CAPEX y previsiones de caja
        run: python quality-value-radar/scripts/reliability_v5.py
      - name: Calcular escenarios y prueba retrospectiva v6
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python quality-value-radar/scripts/opportunity_v6.py
      - name: Sensibilidad del CAPEX, dilución y adquisiciones v7
        run: python quality-value-radar/scripts/sensitivity_v7.py
      - name: Auditar acciones y capital adquirido v8
        run: python quality-value-radar/scripts/audit_v8.py
      - name: Modelos económicos sectoriales v9
        run: python quality-value-radar/scripts/economic_v9.py
      - name: Actualizar alertas de investigación
        run: python quality-value-radar/scripts/opportunity_alerts_v6.py
      - name: Validar integridad del modelo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('quality-value-radar/data/intrinsic.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['schema']=='qvr-auto-v1'
          assert data.get('enhancement',{}).get('version')=='2.0', 'TTM/ROIC v2 missing'
          assert data.get('economicUpgrade',{}).get('version')=='4.0-precheck'
          for ticker,row in data['companies'].items():
              assert row.get('economicReview',{}).get('status') in ('requires_reconciliation','pending_recalculation')
              assert row.get('classification') != 'possible_discount', 'Economic review is not investment-grade'
              if row.get('classification')=='possible_discount':
                  assert row['status']=='ready' and row['fundamentalQualityGate'] and row['adjustedRoic']['status']=='available'
                  assert row['fairValue']>row['quote']['price']>0
                  assert row['historicalPfcfSamples']>=3
                  assert row['marginOfSafetyPct']>=25
          evidence=json.loads(Path('quality-value-radar/data/reliability_v5.json').read_text())
          assert evidence['schema']=='qvr-v5-evidence' and not evidence['signalsAllowed']
          assert evidence['counters']['automaticBuySignals']==0
          v6=json.loads(Path('quality-value-radar/data/opportunity_v6.json').read_text())
          backtest=json.loads(Path('quality-value-radar/data/backtest_v6.json').read_text())
          alerts=json.loads(Path('quality-value-radar/data/opportunity_alerts_v6.json').read_text())
          assert v6['schema']=='qvr-v6' and not v6['transactionSignals']
          sensitivity=json.loads(Path('quality-value-radar/data/sensitivity_v7.json').read_text())
          assert sensitivity['schema']=='qvr-sensitivity-v7' and not sensitivity['automaticBuyDecisions']
          assert len(sensitivity['models'])==6
          audit=json.loads(Path('quality-value-radar/data/audit_v8.json').read_text())
          assert audit['schema']=='qvr-v8-audit' and not audit['signalsAllowed']
          assert len(audit['companies'])==3
          economic=json.loads(Path('quality-value-radar/data/economic_v9.json').read_text())
          assert economic['schema']=='qvr-economic-model-v9' and economic['companyCount']==6
          assert not economic['signalsAllowed']
          assert all(m['verifiedBuyPrice'] is None and len(m['scenarios'])==3 for m in economic['models'].values())
          assert all(v['ledgerTieOut']=='pass' for v in audit['companies'].values())
          assert backtest['schema']=='qvr-pit-backtest-v6' and not backtest['strategyPerformanceClaim']
          assert alerts['schema']=='qvr-alerts-v6' and alerts['action']=='research_only'
          assert all(m['investmentAction'] in ('research_only','watch_price_for_due_diligence') for m in v6['models'].values())
          intldata=json.loads(Path('quality-value-radar/data/international.json').read_text())
          assert intldata['schema']=='qvr-international-v1'
          for t in ['CSU.TO','ASML','DNP.WA']:
              v=intldata['companies'][t].get('valuation',{})
              if v.get('status')=='preliminary':
                  assert 0<v['bear']<v['base']<v['bull']
                  assert v['investmentSignal']=='human_review_required'
                  assert v['fx']['date'] and v['quoteDate']
                  assert len(v['annualFcf'])>=3
              else:
                  assert v.get('status') in ('unavailable',None)
          print('Validado',len(data['companies']),'análisis; completos',data['completed'])
          PY
      - name: Registrar datos de investigación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality-value-radar/data/economic_v9.json quality-value-radar/data/audit_v8.json quality-value-radar/data/sensitivity_v7.json quality-value-radar/data/intrinsic.json quality-value-radar/data/international.json quality-value-radar/data/reliability_v5.json quality-value-radar/data/opportunity_v6.json quality-value-radar/data/backtest_v6.json quality-value-radar/data/opportunity_alerts_v6.json
          if ! git diff --cached --quiet; then
            git commit -m "data(qvr): actualizacion semanal de valoracion SEC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
