name: Actualizar precios del Quality Value Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar cierres
        run: python radar/update_prices.py
      - name: Guardar cotizaciones fechadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/prices.json
          if ! git diff --cached --quiet; then
            git commit -m "data: cotizaciones del radar"
            git push
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar web con precios actualizados
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar actualización
        id: deployment
        uses: actions/deploy-pages@v4
