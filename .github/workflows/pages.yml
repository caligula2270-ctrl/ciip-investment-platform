name: Deploy CIIP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['CIIP Weekly SEC Fundamentals', 'CIIP Daily Market Data']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate CIIP JavaScript and SEC historian
        run: |
          node --check valuation.js
          node --check history.js
          node --check sector.js
          node --check audit.js
          node --check per_share.js
          python -m py_compile scripts/update_fundamentals.py scripts/ciip_quality_controls.py scripts/ciip_sector_models.py scripts/ciip_capital_filings.py scripts/build_ciip_audits.py scripts/build_ciip_per_share.py
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_ciip_*.py' -v
      - name: Validate Quality Value Radar syntax
        run: |
          node --check quality-value-radar/app.js
          python -m py_compile quality-value-radar/scripts/build_intrinsic_radar.py
          python -m py_compile quality-value-radar/scripts/economic_review_v4.py
          python -m py_compile quality-value-radar/scripts/value_international.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
