name: CIIP Weekly SEC Fundamentals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_fundamentals.py'
      - 'scripts/ciip_quality_controls.py'
      - 'scripts/ciip_sector_models.py'
      - 'scripts/ciip_capital_filings.py'
      - 'scripts/build_ciip_audits.py'
      - 'scripts/build_ciip_per_share.py'
      - 'scripts/audit_ciip_models.py'
      - 'audits/validation_evidence.json'
      - 'scripts/test_ciip_*.py'
      - 'audits/per_share_inputs.json'
      - 'audits/evidence.json'
      - 'audits/PLAYBOOK.md'
      - '.github/workflows/fundamentals.yml'
  schedule:
    - cron: '45 7 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ciip-fundamentals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalization and share reconciliation
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_ciip_*.py' -v
      - name: Download SEC reported fundamentals
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/update_fundamentals.py
      - name: Compile five-company financial audit dossiers
        run: python scripts/build_ciip_audits.py
      - name: Build source-linked five-company per-share valuation screens
        run: python scripts/build_ciip_per_share.py
      - name: Independently audit all five valuation models
        run: python scripts/audit_ciip_models.py
      - name: Publish SEC facts and audit report safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp fundamentals-auto.json /tmp/ciip-fundamentals-auto.json
          cp audits/latest.json /tmp/ciip-audit-latest.json
          cp audits/REPORT.md /tmp/ciip-audit-report.md
          cp audits/per_share_latest.json /tmp/ciip-per-share-latest.json
          cp audits/PER_SHARE_REPORT.md /tmp/ciip-per-share-report.md
          cp audits/model_validation_latest.json /tmp/ciip-validation-latest.json
          cp audits/MODEL_VALIDATION_REPORT.md /tmp/ciip-validation-report.md
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            # Generated artifacts must be reapplied on a fresh branch head.
            # Do NOT rebase timestamped JSON files: concurrent bot writes conflict.
            git reset --hard origin/main
            cp /tmp/ciip-fundamentals-auto.json fundamentals-auto.json
            cp /tmp/ciip-audit-latest.json audits/latest.json
            cp /tmp/ciip-audit-report.md audits/REPORT.md
            cp /tmp/ciip-per-share-latest.json audits/per_share_latest.json
            cp /tmp/ciip-per-share-report.md audits/PER_SHARE_REPORT.md
            cp /tmp/ciip-validation-latest.json audits/model_validation_latest.json
            cp /tmp/ciip-validation-report.md audits/MODEL_VALIDATION_REPORT.md
            git add fundamentals-auto.json audits/latest.json audits/REPORT.md audits/per_share_latest.json audits/PER_SHARE_REPORT.md audits/model_validation_latest.json audits/MODEL_VALIDATION_REPORT.md
            if git diff --cached --quiet; then
              echo "No changes in SEC fundamentals or audits"
              exit 0
            fi
            git commit -m "data: publish SEC facts and five issuer research audits"
            if git push origin HEAD:main; then
              echo "Audit data published on attempt $attempt"
              exit 0
            fi
            echo "Concurrent update; refreshing remote main and retrying"
            sleep $((2 * attempt))
          done
          echo "Audit publication failed after six attempts" >&2
          exit 1
