name: CIIP Weekly SEC Fundamentals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_fundamentals.py'
      - 'scripts/ciip_quality_controls.py'
      - 'scripts/ciip_sector_models.py'
      - 'scripts/ciip_capital_filings.py'
      - 'scripts/build_ciip_audits.py'
      - 'audits/evidence.json'
      - 'audits/PLAYBOOK.md'
      - '.github/workflows/fundamentals.yml'
  schedule:
    - cron: '45 7 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ciip-fundamentals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalization and share reconciliation
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_ciip_*.py' -v
      - name: Download SEC reported fundamentals
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/update_fundamentals.py
      - name: Compile five-company financial audit dossiers
        run: python scripts/build_ciip_audits.py
      - name: Commit source-linked facts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals-auto.json audits/latest.json audits/REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "data: update SEC fundamentals and five issuer audits"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Fundamentals published (attempt $attempt)"
                exit 0
              fi
              echo "Concurrent push detected; retrying ($attempt)"
              sleep $((2 * attempt))
            done
            echo "Could not publish fundamentals after 5 attempts" >&2
            exit 1
          fi
